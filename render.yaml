services:
  - type: web
    name: liblog-backend
    env: node
    buildCommand: "cd server && npm install && rm -rf node_modules/.prisma && npx prisma generate && npx prisma db push"
    startCommand: "cd server && npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: liblog-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: liblog-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: psql
    name: liblog-db
    plan: free
    postgresMajorVersion: 15
